[project]
name = "autotrash"
version = "0.0.0"
description = "Script to automatically purge old trash"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [{ name = "Bram Neijt", email = "bram@neijt.nl" }]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = []

[project.urls]
Repository = "https://github.com/bneijt/autotrash"

[project.scripts]
autotrash = "autotrash.app:main"

[dependency-groups]
dev = [
  "prek>=0.5.11",
  "pytest>=9.0.3",
  "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrash"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
